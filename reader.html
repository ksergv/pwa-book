<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Книга</title>

<meta name="theme-color" content="#000000">

<style>
body{
margin:0;
font-family:Arial;
background:#111;
color:white;
}

/* контейнер */

#container{
display:flex;
height:100vh;
}

h1{
text-align:center;
}

/* меню */

.menu-panel{
position:fixed;
top:0;
left:0;
width:260px;
height:100%;
background:#101010;
padding:20px;
overflow:auto;

transform:translateX(-100%);
transition:transform 0.3s ease;

z-index:999;
}

.menu-panel.open{
transform:translateX(0);
}

.menu-panel h3{
margin-top:0;
}

.menu-panel a{
color:white;
text-decoration:none;
display:block;
padding:8px;
border-radius:4px;
}

.menu-panel a:hover{
background:#444;
}

/* область книги */

#book-area{
flex:1;
display:flex;
flex-direction:column;
}



.book-image{
  display: block;
    width: 80%;
    height: auto;
    margin: 1em auto;
}

.image-xs {
    display: block;
    width: 20%;
    height: auto;
    margin: 1em auto;
}

.image-sm {
    display: block;
    width: 40%;
    height: auto;
    text-align: left;
    margin: 1em auto;
}

.image-md {
    display: block;
    width: 60%;
    height: auto;
    margin: 1em auto;
}

.image-lg {
    display: block;
    width: 80%;
    height: auto;
    margin: 1em auto;
}
.image-left {
    float: left;
    margin: 0 10px 10px 0;
}

.image-right {
    float: right;
    margin: 0 0 10px 10px;
}
/*----------------------------------
  Таблица управляющих кодов
----------------------------------*/

.code-table {
    width: 100%;
    border-collapse: collapse;
    margin: 1.5em auto;
    font-size: 0.92em;
    text-align: center;
    border: 2px solid #3f5f8a;
    box-shadow: 0 2px 8px rgba(0,0,0,.12);
    background: #ffffff;
}

.code-table caption {
    font-weight: bold;
    font-size: 1.05em;
    color: #020a11;
    margin-bottom: .6em;
}

.code-table th,
.code-table td {
    border: 1px solid #bfcddd;
    color:#000;
    padding: .45em .3em;
}

.code-table th {
    background: linear-gradient(#5b7faa, #45698f);
    color:#000;
    font-weight: 600;
}

.code-table td:first-child,
.code-table th:first-child {
    font-weight: bold;
    background: #edf4fb;
}

.code-table tr:nth-child(even) td {
    background: #f8fbff;
}

.code-table td:hover {
    background: #fff7d6;
    transition: background .2s ease;
}

  pre {
    display: block;
    width: fit-content;
    max-width: 100%;
    margin: 20px auto;
    padding: 20px;
    background: rgb(93, 95, 116);
    border-radius: 10px;
    overflow-wrap: break-word;
    font-family: Consolas, "Courier New", monospace;
    line-height: 1;
    color: white;
}
/* контейнер страницы */

#page{
flex:1;
overflow:hidden;
background:white;
color:black;
position:relative;
}

/* слой страницы */

.page-inner{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
overflow:auto;
padding:40px;
box-sizing:border-box;

font-size:var(--fontSize,18px);
line-height:1.6;

background:white;

transition:transform 0.35s ease;
}

/* текущая страница */

.page-current{
transform:translateX(0);
z-index:2;
}

/* новая справа */

.page-next{
transform:translateX(100%);
}

/* новая слева */

.page-prev{
transform:translateX(-100%);
}

/* навигация */

nav{
position:sticky;
bottom:0;
display:flex;
justify-content:center;
align-items:center;
gap:6px;
padding:10px;
background:#111;
}

nav button{
flex:1;
max-width:70px;
font-size:20px;
padding:10px;
border:none;
border-radius:6px;
background:#333;
color:white;
cursor:pointer;
}

nav button:hover{
background:#555;
}

/* кнопка меню */

#menuButton{
display:none;
position:fixed;
top:10px;
left:50px;
z-index:1000;
padding:10px 14px;
font-size:18px;
background:#111;
color:white;
border:none;
border-radius:6px;
}

/* режим чтения */

.reading-ui-hidden h1{
display:none;
}

.reading-ui-hidden nav{
display:none;
}

/* плавное появление */

nav{
transition:opacity 0.3s;
}

h1{
transition:opacity 0.3s;
}

#backButton{
position:fixed;
top:15px;
left:10px;
font-size:22px;
width:35px;
background:blue;
color:white;
border:none;
border-radius: 5px;
cursor:pointer;
z-index:1000;
}

#passwordOverlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#111;
display:none;   /* важно */
align-items:center;
justify-content:center;
z-index:2000;
}

.passwordBox{
background:#222;
padding:30px;
border-radius:10px;
text-align:center;
}

.passwordBox input{
padding:10px;
font-size:16px;
margin-top:10px;
}

.passwordBox button{
margin-top:10px;
padding:10px 20px;
}

#passwordError{
color:#ff6666;
margin-top:10px;
}
ul{
    margin-top: 30px;
}
/* ===== MOBILE ===== */

@media (max-width:768px){

h1{
    font-size: 1.35rem;
    margin-bottom: 30px;
}
nav button{
font-size:18px;
padding:12px 6px;
max-width:60px;
}

#container{
flex-direction:column;
}

.menu-panel{
position:fixed;
top:0;
left:0;
width:260px;
height:100%;
background:#101010;
padding:20px;
overflow:auto;

transform:translateX(-100%);
transition:transform 0.3s ease;

z-index:999;
}

.menu-panel.open{
transform:translateX(0);
}

#menuButton{
display:block;
}

.page-inner{
padding:20px;
}

}
@media (orientation: landscape) and (max-width:900px){
nav button{
font-size:18px;
padding:12px 6px;
max-width:60px;
}

#container{
flex-direction:column;
}

.menu-panel{
position:fixed;
top:0;
left:0;
width:260px;
height:100%;
background:#101010;
padding:20px;
overflow:auto;

transform:translateX(-100%);
transition:transform 0.3s ease;

z-index:999;
}

.menu-panel.open{
transform:translateX(0);
}

#menuButton{
display:block;
}

.page-inner{
padding:20px;
}


}

</style>

</head>

<body>
 <div id="passwordOverlay">

<div class="passwordBox">

<h2>🔒 Книга защищена</h2>

<input id="passwordInput" type="password" placeholder="Введите пароль">

<button id="passwordButton">Открыть</button>

<p id="passwordError"></p>

</div>
</div>
<button id="backButton">⬅</button>
<button id="menuButton">☰</button>
<h1 id="bookTitle"></h1>
<div id="container">

<div class="menu-panel">

<ul id="menu-toc">Содержание:</ul>

</div>

<div id="book-area">

<div id="page"></div>


<nav>
<button id="prev">◀</button>
<button id="next">▶</button>
<button id="textMinus">🔍−</button>
<button id="textPlus">🔍+</button>
</nav>


</div>

</div>

<script>

const params = new URLSearchParams(location.search);

const bookName = params.get("book") || "";

const bookPath = "books/" + bookName + "/";

const key = "bookpass_" + bookName;


document.getElementById("backButton").onclick = function(){

location.href = "index.html"

}
    
let fontSize = localStorage.getItem("fontSize") || 18;

document.documentElement.style.setProperty("--fontSize", fontSize + "px");
let pages=[];
let current=0;
/* меню */
const menuButton=document.getElementById("menuButton");
const menu=document.querySelector(".menu-panel");

menuButton.onclick=()=>{
menu.classList.toggle("open");
};



function openForm(book){


const overlay = document.getElementById("passwordOverlay")
const input = document.getElementById("passwordInput")
const button = document.getElementById("passwordButton")
const error = document.getElementById("passwordError")

overlay.style.display = "flex"

/* очистить поле */

input.value = ""
error.textContent = ""

/* обработчик кнопки */

button.onclick = function(){



const pass = input.value



if(pass === book.password){

localStorage.setItem(key, pass)

overlay.style.display = "none";

continueLoad(book)
return
}
else{

error.textContent = "Неверный пароль"

}

}};

/* загрузка книги */

async function loadBook(){



const book = await fetch(bookPath + "book.json").then(r => r.json())


/* если книга без пароля */

if(!book.password){

continueLoad(book)
return

} else {

/* проверяем сохранённый пароль */

const saved = localStorage.getItem(key)



/* пароль уже введён */

if(saved === book.password){

continueLoad(book)
return

} else {

/* показать форму */

openForm(book)

}}
};

/* книга без пароля */


async function continueLoad(book){

document.getElementById("bookTitle").textContent = book.title

const menuToc=document.getElementById("menu-toc");

for(let i=0;i<book.pages.length;i++){

const p=book.pages[i];

const html = await fetch(bookPath + p.file).then(r=>r.text());

const fixedHtml = html.replace(/src="img\//g,'src="'+bookPath+'img/');

pages.push(fixedHtml);

/* извлекаем заголовок */

const parser = new DOMParser();
const doc = parser.parseFromString(html,"text/html");

let title =
doc.querySelector("h1")?.textContent ||
doc.querySelector("h2")?.textContent ||
p.id;

/* меню */

const li=document.createElement("li");
const a=document.createElement("a");

a.href="#";
a.textContent=title;

a.onclick=(e)=>{
e.preventDefault();

showPage(i);

document.querySelector(".menu-panel").classList.remove("open");

};

li.appendChild(a);
menuToc.appendChild(li);

}

/* восстановить страницу */

const saved=localStorage.getItem("bookPage");

if(saved){
current=parseInt(saved);
}

showPage(current)

}
/* показать страницу */

function showPage(i){

if(i<0||i>=pages.length) return;

const container=document.getElementById("page");

const oldPage=container.querySelector(".page-current");

const newPage=document.createElement("div");

newPage.className="page-inner";

newPage.innerHTML=pages[i];

/* направление */

const forward=i>current;

if(forward){
newPage.classList.add("page-next");
}else{
newPage.classList.add("page-prev");
}

container.appendChild(newPage);

/* запуск анимации */

requestAnimationFrame(()=>{

if(oldPage){

oldPage.style.transform=forward
? "translateX(-100%)"
: "translateX(100%)";

}

newPage.style.transform="translateX(0)";

});

/* удалить старую страницу */

setTimeout(()=>{
if(oldPage) oldPage.remove();
newPage.classList.add("page-current");
newPage.classList.remove("page-next","page-prev");
},350);

current=i;

localStorage.setItem("bookPage",current);

}
/* кнопки */

document.getElementById("next").onclick=()=>showPage(current+1);

document.getElementById("prev").onclick=()=>showPage(current-1);

/* изменение размера текста */

document.getElementById("textPlus").onclick = () => {
    fontSize = Number(fontSize) + 2;

    if (fontSize > 40) fontSize = 40;

    document.documentElement.style.setProperty(
        "--fontSize",
        fontSize + "px"
    );

    localStorage.setItem("fontSize", fontSize);
};

document.getElementById("textMinus").onclick = () => {
    fontSize = Number(fontSize) - 2;

    if (fontSize < 12) fontSize = 12;

    document.documentElement.style.setProperty(
        "--fontSize",
        fontSize + "px"
    );

    localStorage.setItem("fontSize", fontSize);
};

/* ===== UI режим чтения ===== */

let uiHidden=false;

function toggleUI(){

uiHidden=!uiHidden;

if(uiHidden){
document.body.classList.add("reading-ui-hidden");
}else{
document.body.classList.remove("reading-ui-hidden");
}

}
/* swapping */
let touchStartX=0;
let touchEndX=0;

const pageElement=document.getElementById("page");

pageElement.addEventListener("touchstart",(e)=>{
touchStartX=e.changedTouches[0].screenX;
});

pageElement.addEventListener("touchend",(e)=>{
touchEndX=e.changedTouches[0].screenX;

if(touchEndX-touchStartX>60){
showPage(current-1);
}

if(touchStartX-touchEndX>60){
showPage(current+1);
}

});

/* тап по странице */

document.getElementById("page").addEventListener("click",(e)=>{

if(e.target.tagName==="IMG") return;

toggleUI();

});

/* авто режим landscape */

function checkLandscape(){

const isMobile = window.innerWidth <= 900;

if(isMobile && window.innerWidth > window.innerHeight){

document.body.classList.add("reading-ui-hidden");

}else{

document.body.classList.remove("reading-ui-hidden");

}

}
/* запуск */


window.addEventListener("DOMContentLoaded", loadBook)
</script>
</body>
</html>
